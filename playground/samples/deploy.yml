name: Deploy
on:
  push:
    branches: [main]
env:
  NODE_VERSION: 20
  DEBUG: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci --prefer-offline # cache first
      - name: Build
        run: |
          npm run build
          echo "done"
