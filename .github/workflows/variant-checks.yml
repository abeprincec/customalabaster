name: Variant checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:variants
        working-directory: playground
      - run: npm test
        working-directory: playground
